name: Metrics

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches: ["main", "test"]
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  github:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Metrics
        uses: AjmalShajahan/metrics@custom
        with:
          # Output and authentication
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: ${{ secrets.GIST }}

          # General configuration
          config_order: base.header, languages, wakatime, achievements, habits, notable, reactions, base.activity, base.metadata
          config_timezone: Asia/Kolkata
          config_gemoji: yes
          users_ignored: ${{ vars.USERS_IGNORED }}
          commits_authoring: ${{ vars.COMMITS_AUTHORING }}

          # Base
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories: 200
          repositories_batch: 100
          repositories_owned: yes
          repositories_affiliations: ""
          repositories_skipped: ${{ vars.REPOSITORIES_SKIPPED }}

          # Languages
          plugin_languages: yes
          plugin_languages_details: lines, percentage, bytes-size
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_skipped: ${{ vars.PLUGIN_LANGUAGES_SKIPPED }}
          plugin_languages_ignored: ${{ vars.PLUGIN_LANGUAGES_IGNORED }}
          plugin_languages_limit: 8
          plugin_languages_recent_days: 7
          plugin_languages_recent_load: 300
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10
          # plugin_languages_threshold: 10

          # Lines of code
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_delay: 30
          plugin_lines_skipped: ${{ vars.PLUGIN_LINES_SKIPPED }}

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          # plugin_achievements_threshold: X

          # WakaTime
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, languages-graphs, editors, os
          plugin_wakatime_limit: 8
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_user: .user.login

          # Reactions
          plugin_reactions: yes
          plugin_reactions_details: count

          # Coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_indepth: yes
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_skipped: ${{ vars.PLUGIN_NOTABLE_SKIPPED }}

          # Optional plugins
          plugin_isocalendar: yes
          plugin_topics: yes
          plugin_followup: yes
          plugin_followup_sections: user, #repositories
          plugin_followup_indepth: yes
          # plugin_followup_archived: no
          # debug: yes
