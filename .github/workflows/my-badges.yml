name: my-badges

on:
  workflow_dispatch:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"
  push:
    branches: ["main", "test"]
    paths:
      - ".github/workflows/my-badges.yml"

permissions:
  contents: write

jobs:
  my-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my-badges fork
        uses: actions/checkout@v7
        with:
          repository: AjmalShajahan/my-badges
          ref: custom
          path: my-badges-source

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-badges-source/package-lock.json

      - name: Install and build fork
        working-directory: my-badges-source
        run: |
          npm ci
          npm run build

      - name: Generate badges
        run: node "$GITHUB_WORKSPACE/my-badges-source/dist/src/main.js" "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.MY_BADGES_TOKEN }}
